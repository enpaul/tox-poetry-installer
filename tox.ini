[tox]
envlist = py3{8,9,10,11,12} static, static-tests, security
skip_missing_interpreters = true

[testenv]
description = Run the tests
require_locked_deps = true
require_poetry = true
locked_deps =
    pytest
    pytest-cov
    toml
commands =
    pytest {toxinidir}/tests/ \
      --cov {toxinidir}/tox_poetry_installer \
      --cov-config {toxinidir}/.coveragerc \
      --cov-report term-missing

[testenv:static]
description = Static formatting and quality enforcement
basepython = py310
platform = linux
ignore_errors = true
locked_deps =
    black
    blacken-docs
    isort
    mdformat
    mdformat-gfm
    mypy
    pre-commit
    pre-commit-hooks
    pylint
    types-toml
commands =
    pre-commit run \
      --all-files
    pylint {toxinidir}/tox_poetry_installer/ \
      --rcfile {toxinidir}/.pylintrc
    mypy {toxinidir}/tox_poetry_installer/ \
      --ignore-missing-imports \
      --no-strict-optional

[testenv:static-tests]
description = Static formatting and quality enforcement for the tests
basepython = py310
platform = linux
ignore_errors = true
locked_deps =
    pylint
    pytest
    mypy
    toml
    types-toml
commands =
    pylint {toxinidir}/tests/ \
      --rcfile {toxinidir}/.pylintrc
    mypy {toxinidir}/tests/ \
      --ignore-missing-imports \
      --no-strict-optional

[testenv:security]
description = Security checks
basepython = py310
platform = linux
ignore_errors = true
skip_install = true
locked_deps =
    bandit
    safety
    poetry
commands =
    bandit {toxinidir}/tox_poetry_installer/ \
      --recursive \
      --quiet
    bandit {toxinidir}/tests/ \
      --recursive \
      --quiet \
      --skip B101
